# Lint, test, build and publish the site to GitHub Pages on every push to main.
# GitHub Pages is static hosting: the contact API (server/) does not run here,
# so this build uses VITE_CONTACT_ENDPOINT=none and the contact page offers email.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build for GitHub Pages
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # This copy is a mirror: canonical links, sitemap and JSON-LD point
          # to the primary site so search engines index only that one.
          VITE_SITE_URL: https://vinod-kumar.in
          VITE_CONTACT_ENDPOINT: none
          VITE_TRAILING_SLASH: 'true'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
